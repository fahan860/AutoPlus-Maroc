services:
  db:
    image: postgis/postgis:16-3.4
    container_name: autoplus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoplus}
      POSTGRES_DB: ${POSTGRES_DB:-autoplus}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoplus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autoplus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: autoplus-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-autoplus}:${POSTGRES_PASSWORD:-autoplus}@db:5432/${POSTGRES_DB:-autoplus}
      REDIS_URL: redis://redis:6379
      ML_API_URL: http://ml-api:8000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-api:
        condition: service_started
    volumes:
      - ./api:/usr/src/app
      - /usr/src/app/node_modules

  # Service ML (FastAPI) : modeles de prediction, appele uniquement par l'API Node.
  # Port publie sur 127.0.0.1 seulement, pour tester /docs en local sans l'exposer au reseau.
  ml-api:
    build:
      context: ./ml
      dockerfile: service/Dockerfile
    container_name: autoplus-ml-api
    restart: unless-stopped
    # Cles du LLM de l'agent IA (GROQ_API_KEY / MISTRAL_API_KEY, LLM_FOURNISSEUR) ; sans ce fichier,
    # l'agent est simplement desactive. DATABASE_URL ci-dessous remplace celle du fichier.
    env_file:
      - path: ./api/.env
        required: false
    environment:
      # Modele B : pannes et garages lus dans PostgreSQL
      DATABASE_URL: postgres://${POSTGRES_USER:-autoplus}:${POSTGRES_PASSWORD:-autoplus}@db:5432/${POSTGRES_DB:-autoplus}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Modele e5-large (~2,2 Go) : telecharge au 1er demarrage, conserve ensuite
      - hf-cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 1er demarrage : telechargement + chargement d'e5-large
      start_period: 300s

volumes:
  postgres-data:
  redis-data:
  hf-cache:
